<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 飞影企业工作台</title>
    <link rel="stylesheet" href="/login.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="authTitle">
        <h1 id="authTitle">登录</h1>
        <p id="authSubtitle" class="muted">使用工作邮箱与密码登录企业工作台。</p>
        <form id="authForm">
          <label id="emailField">工作邮箱<input id="email" type="email" autocomplete="username" required></label>
          <label id="passwordField">密码<input id="password" type="password" autocomplete="current-password" required></label>
          <label id="newPasswordField" hidden>新密码<input id="newPassword" type="password" autocomplete="new-password"></label>
          <button id="submitButton" type="submit">登录</button>
          <p id="authError" class="error" role="alert"></p>
        </form>
      </section>
    </main>
  </body>
</html>
