<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>成员管理 · 飞影企业工作台</title>
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/shell.css">
    <link rel="stylesheet" href="/members.css">
    <script src="/shell.js" defer></script>
    <script src="/members.js" defer></script>
  </head>
  <body data-shell-page="members">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="app-brand" href="/projects.html"><span class="app-brand-mark" aria-hidden="true">飞</span>飞影工作台</a>
        <nav class="app-nav" aria-label="主导航">
          <a href="/projects.html" data-page="projects" data-feature="project-content" hidden>项目</a>
          <a href="/assets.html" data-page="assets" data-feature="assets" hidden>素材中心</a>
          <a href="/members.html" data-page="members" data-role="admin" hidden>成员管理</a>
        </nav>
      </aside>
      <div class="app-frame">
        <header class="app-topbar"><div class="identity-context"><strong data-shell-organization>企业工作台</strong><span data-shell-member>正在读取身份</span></div><button class="identity-logout" type="button" data-shell-logout>退出</button></header>
        <main id="mainContent" class="page-content">
          <div class="page-header"><div><p class="eyebrow">设置</p><h1>成员管理</h1><p class="page-description">管理组织成员、角色与登录状态。</p></div><div class="page-actions"><button id="openMemberDialog" type="button">创建成员</button></div></div>
          <section class="surface" aria-labelledby="memberListTitle"><div class="surface-header"><div><h2 id="memberListTitle">现有成员</h2><p>停用后，该成员将无法继续访问企业工作台。</p></div></div><p id="membersError" class="notice error" role="alert"></p><div id="memberList" class="member-list"></div></section>
        </main>
      </div>
    </div>
    <dialog id="memberDialog" aria-labelledby="memberDialogTitle">
      <div class="dialog-header"><div><p class="eyebrow">组织成员</p><h2 id="memberDialogTitle">创建成员</h2></div><button id="closeMemberDialog" class="dialog-close" type="button" aria-label="关闭创建成员">×</button></div>
      <div class="dialog-body">
        <form id="createMemberForm" class="grid">
          <label class="wide">工作邮箱<input id="memberEmail" type="email" required></label>
          <label>姓名<input id="memberName" required></label>
          <label>角色<select id="memberRole"><option value="member">成员</option><option value="admin">管理员</option></select></label>
          <div class="actions wide"><button type="submit">创建并生成临时密码</button></div>
        </form>
        <div id="temporaryPassword" class="temporary-password" hidden role="status"></div>
      </div>
    </dialog>
    <dialog id="disableMemberDialog" aria-labelledby="disableMemberTitle">
      <div class="dialog-header"><div><p class="eyebrow">危险操作</p><h2 id="disableMemberTitle">确认停用成员</h2></div><button id="closeDisableMemberDialog" class="dialog-close" type="button" aria-label="关闭停用确认">×</button></div>
      <div class="dialog-body"><p id="disableMemberSummary">停用后，该成员将无法继续访问企业工作台。</p><div class="actions"><button id="cancelDisableMember" class="secondary" type="button">取消</button><button id="confirmDisableMember" class="danger-solid" type="button">确认停用</button></div></div>
    </dialog>
  </body>
</html>
