<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>项目 · 飞影企业工作台</title><link rel="stylesheet" href="/project-content.css"><script src="/projects.js" defer></script></head>
<body><main class="shell">
  <header><div><p class="eyebrow">企业内容</p><h1>项目</h1></div><a href="/">返回工作台</a></header>
  <section><h2>创建项目</h2><form id="projectForm" class="grid">
    <label>项目名称<input name="name" required maxlength="120"></label>
    <label>交付日期<input name="delivery_date" type="date"></label>
    <label class="wide">项目说明<textarea name="description" rows="3"></textarea></label>
    <div class="actions wide"><p id="formError" class="notice error" role="alert"></p><button type="submit">创建项目</button></div>
  </form></section>
  <section><div class="section-head"><h2>全部项目</h2><button id="refresh" class="secondary" type="button">刷新</button></div><div id="projectList" class="project-list"><p class="empty">正在加载...</p></div><p id="listError" class="notice error" role="alert"></p></section>
</main></body></html>
