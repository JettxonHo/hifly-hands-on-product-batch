# CE-04 contract fragment only. CE-07 owns service deployment and live validation.
# noVNC is published on host loopback only so an SSH tunnel can reach it without public exposure.
services:
  cloud_executor_login:
    build:
      context: ..
      dockerfile: deploy/cloud-executor-login.Dockerfile
    environment:
      CLOUD_EXECUTOR_ENABLED: "true"
      CLOUD_EXECUTOR_MODE: "login"
      CLOUD_EXECUTOR_ROOT: "/var/lib/hifly-executor"
      CLOUD_EXECUTOR_PROFILE_DIR: "/var/lib/hifly-executor/profile"
      CLOUD_EXECUTOR_DISPLAY: ":99"
      CLOUD_EXECUTOR_NOVNC_BIND_HOST: "127.0.0.1"
      CLOUD_EXECUTOR_NOVNC_PORT: "6080"
      DISPLAY: ":99"
    volumes:
      - cloud_executor_profile:/var/lib/hifly-executor/profile
    ports:
      - "127.0.0.1:6080:6080"
    networks:
      - cloud_executor_private
    restart: "no"
    init: true
    stdin_open: true
    tty: true

volumes:
  cloud_executor_profile:

networks:
  cloud_executor_private:
    internal: true
