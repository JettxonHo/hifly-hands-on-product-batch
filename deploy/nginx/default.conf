# The health listener is intentionally bound to the proxy container loopback.
# It is not published by Compose and is the only route that overrides the
# application Host header for its trusted internal health check.
server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1;

    location = /healthz {
        proxy_set_header Host 127.0.0.1:3000;
        proxy_set_header Origin "";
        proxy_pass http://app:3000/healthz;
    }

    location / {
        return 404;
    }
}

# Reject every HTTP Host except the configured public host.  In particular,
# do not use $host in the redirect: an attacker-controlled Host must never be
# reflected into a Location header.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${PUBLIC_HOST};

    location / {
        return 308 https://${PUBLIC_HOST}$request_uri;
    }
}

# A separate default TLS server keeps unknown SNI/Host requests fail-closed.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_HOST};

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128m;

    # Public /healthz intentionally uses the normal proxy path below.  The
    # application must see the configured Host/Origin and enforce its own
    # trusted request security; only loopback:8080 is an internal health seam.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
    }
}
