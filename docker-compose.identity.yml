services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hifly_identity_test
      POSTGRES_USER: hifly_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hifly_test -d hifly_identity_test"]
      interval: 2s
      timeout: 3s
      retries: 20
