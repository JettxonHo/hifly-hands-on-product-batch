name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: git diff --check

  identity-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hifly_identity_test
          POSTGRES_USER: hifly_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hifly_test -d hifly_identity_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      IDENTITY_TEST_DATABASE_URL: postgresql://hifly_test:ci-test-only@127.0.0.1:5432/hifly_identity_test
      PROJECT_CONTENT_TEST_DATABASE_URL: postgresql://hifly_test:ci-test-only@127.0.0.1:5432/hifly_identity_test
      APPEARANCE_FIDELITY_TEST_DATABASE_URL: postgresql://hifly_test:ci-test-only@127.0.0.1:5432/hifly_identity_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run clean migration and identity integration tests
        run: node --test test/identity-postgres.integration.test.js
      - name: Run ProjectContent v2 PostgreSQL integration
        run: node --test test/project-content-postgres.integration.test.js
      - name: Run Assets PostgreSQL concurrency integration
        run: node --test test/asset-postgres.integration.test.js
      - name: Run Copy generation and quality PostgreSQL integrations
        run: |
          node --test test/copy-generation-postgres.integration.test.js
          node --test test/copy-quality-postgres.integration.test.js
      - name: Run VideoPlanning v2 PostgreSQL integration
        run: node --test test/video-planning-postgres.integration.test.js
      - name: Run Stage 5 Production PostgreSQL authority chain
        run: |
          node --test test/production-order-postgres.integration.test.js
          node --test test/manual-handoff-package-postgres.integration.test.js
          node --test test/manual-execution-postgres.integration.test.js
          node --test test/work-verification-postgres.integration.test.js
          node --test test/work-delivery-postgres.integration.test.js
      - name: Run Fidelity-B Appearance PostgreSQL integration
        run: node --test test/appearance-fidelity-postgres.integration.test.js
      - name: Run Stage 3 AvatarSelection PostgreSQL integration
        run: node --test test/avatar-selection-postgres.integration.test.js
      - name: Run identity browser smoke
        env:
          IDENTITY_BROWSER_SMOKE: "1"
        run: node --test test/identity-browser.test.js
      - name: Install and verify ffmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Run serial browser and media regressions with a clean environment
        run: |
          hifly_chromium_executable="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath());')"
          test -x "$hifly_chromium_executable"
          hifly_tap_file="$RUNNER_TEMP/hifly-serial-browser-media.tap"
          set +e
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-$RUNNER_TEMP}" \
            IDENTITY_BROWSER_EXECUTABLE="$hifly_chromium_executable" \
            node --test --test-concurrency=1 \
              test/video-delivery.test.js \
              test/cloud-executor-playwright.test.js \
              test/operator-single-workspace-stage-2-browser.test.js \
              test/operator-single-workspace-works-browser.test.js \
            >"$hifly_tap_file" 2>&1
          hifly_test_exit=$?
          cat "$hifly_tap_file"
          if [ "$hifly_test_exit" -ne 0 ]; then
            exit "$hifly_test_exit"
          fi
          hifly_skipped_count="$(awk '/^# skipped [0-9]+$/ { count = $3 } END { if (count == "") exit 1; print count }' "$hifly_tap_file")"
          test "$hifly_skipped_count" = "0"
